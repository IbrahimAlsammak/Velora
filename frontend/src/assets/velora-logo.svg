<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170">
  <title>Velora</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B98F"/>
      <stop offset="1" stop-color="#B08A5E"/>
    </linearGradient>
  </defs>

  <!-- Mark: arch (modesty / grace) framing a draped V -->
  <g transform="translate(20,10)">
    <path d="M6,150 V62 A54,54 0 0 1 114,62 V150" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M16,150 V64 A44,44 0 0 1 104,64 V150" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
    <path d="M60,20 L63.5,30 L60,40 L56.5,30 Z" fill="url(#gold)"/>
    <path d="M34,60 L46,60 L62,116 L76,60 L83,60 L60,136 Z" fill="#5B3A4A"/>
    <line x1="0" y1="150" x2="120" y2="150" stroke="#C4A074" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <text x="170" y="100" font-family="'Cormorant Garamond','Playfair Display',Didot,'Bodoni MT',Georgia,serif"
        font-size="68" font-weight="500" letter-spacing="14" fill="#5B3A4A">VELORA</text>
  <text x="174" y="136" font-family="'Montserrat','Segoe UI',Arial,sans-serif"
        font-size="13" letter-spacing="7" fill="#B08A5E">MODEST · ELEGANCE</text>
</svg>
