spring.application.name=velora-backend
server.port=8080

# ---------- Database (MySQL) ----------
# createDatabaseIfNotExist=true -> MySQL makes the "velora" database for us the first time
spring.datasource.url=jdbc:mysql://localhost:3306/velora?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# The password is NOT stored here. It lives in application-secrets.properties
# (same folder), which is ignored by Git so it never gets uploaded anywhere.
# On the real server, every setting can also come from an "environment variable" instead
# (e.g. SPRING_DATASOURCE_PASSWORD, VELORA_JWT_SECRET) - see docker-compose.yml and .env.example.
spring.config.import=optional:classpath:application-secrets.properties

# ---------- JPA / Hibernate ----------
# "update" = automatically create/adjust tables to match our Java classes (good for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Product photo uploads ----------
# Folder (inside backend/) where uploaded photos are saved
velora.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Frontend address (for CORS) ----------
velora.frontend-url=http://localhost:5173

# ---------- Sample products for a brand-new, empty database ----------
# On the real server this is switched off (VELORA_SAMPLE_DATA=false), so it never adds sample products there
velora.sample-data=true

# ---------- Behind the web server (Caddy) on the real server ----------
# Lets the backend see the visitor's real internet address (used by the login protection)
server.forward-headers-strategy=native

# ---------- Store time zone (for the sales report: "today", "this week"...) ----------
velora.timezone=Asia/Beirut
